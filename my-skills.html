<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKILLVERSE | My Skills</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        /* ================================
           GLOBAL
        ================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f0f12;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .main-container {
            max-width: 1100px;
            margin: auto;
            padding: 45px 25px 70px;
        }


        /* ================================
           BACK BUTTON
        ================================= */

        .back-btn {
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .back-btn:hover {
            color: #f5d76e;
        }


        /* ================================
           HEADER
        ================================= */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            margin-top: 25px;
            margin-bottom: 35px;
        }

        .page-title {
            margin: 0 0 8px;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .page-description {
            color: #92929d;
            margin: 0;
            font-size: 14px;
            line-height: 1.6;
        }


        /* ================================
           ADD BUTTON
        ================================= */

        .add-btn {
            background: #d4af37;
            color: #111111;
            border: none;
            border-radius: 10px;
            padding: 11px 20px;
            font-weight: 700;
            white-space: nowrap;
            transition: 0.3s ease;
        }

        .add-btn:hover {
            background: #f0cf61;
            color: #111111;
            transform: translateY(-2px);
        }


        /* ================================
           ADD SKILL FORM
        ================================= */

        .form-box {
            display: none;
            background: #17171d;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            animation: slideDown 0.3s ease;
        }

        .form-box.active {
            display: block;
        }

        @keyframes slideDown {

            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .form-title {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .form-label {
            color: #d7d7dd;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            background: #101014;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 12px 14px;
        }

        .form-control:focus,
        .form-select:focus {
            background: #101014;
            color: #ffffff;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.10);
        }

        .form-control::placeholder {
            color: #666672;
        }

        .form-select option {
            background: #17171d;
            color: #ffffff;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .save-btn {
            background: #d4af37;
            color: #111111;
            border: none;
            border-radius: 9px;
            padding: 10px 20px;
            font-weight: 700;
        }

        .cancel-btn {
            background: transparent;
            color: #aaaaaf;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 9px;
            padding: 10px 20px;
        }

        .cancel-btn:hover {
            color: #ffffff;
            border-color: rgba(255,255,255,0.3);
        }


        /* ================================
           SEARCH
        ================================= */

        .search-box {
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            background: #17171d;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 13px 16px;
            outline: none;
        }

        .search-input:focus {
            border-color: rgba(212,175,55,0.5);
        }

        .search-input::placeholder {
            color: #666672;
        }


        /* ================================
           EMPTY BOX
        ================================= */

        .empty-box {
            background: #17171d;
            border: 1px dashed rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 45px 25px;
            text-align: center;
            margin-bottom: 30px;
        }

        .empty-box.hidden {
            display: none;
        }

        .empty-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(212,175,55,0.10);
            font-size: 24px;
            margin: 0 auto 18px;
        }

        .empty-box h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .empty-box p {
            color: #858590;
            font-size: 14px;
            margin: 0;
        }


        /* ================================
           SKILL CARDS
        ================================= */

        .skill-card {
            background: #17171d;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
            height: 100%;
            transition: 0.3s ease;
            position: relative;
        }

        .skill-card:hover {
            transform: translateY(-4px);
            border-color: rgba(212,175,55,0.4);
        }

        .skill-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(212,175,55,0.10);
            font-size: 22px;
            margin-bottom: 18px;
        }

        .skill-card h3 {
            font-size: 19px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .skill-category {
            color: #d4af37;
            font-size: 12px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .skill-card p {
            color: #858590;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .level-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.06);
            color: #c8c8cf;
            font-size: 11px;
            margin-bottom: 18px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.07);
            padding-top: 15px;
        }

        .edit-btn,
        .delete-btn {
            border-radius: 8px;
            padding: 7px 13px;
            font-size: 12px;
            cursor: pointer;
        }

        .edit-btn {
            background: rgba(212,175,55,0.10);
            color: #d4af37;
            border: 1px solid rgba(212,175,55,0.2);
        }

        .delete-btn {
            background: rgba(255,70,70,0.08);
            color: #ff7777;
            border: 1px solid rgba(255,70,70,0.15);
        }

        .edit-btn:hover {
            background: rgba(212,175,55,0.18);
        }

        .delete-btn:hover {
            background: rgba(255,70,70,0.15);
        }


        /* ================================
           NO SEARCH RESULT
        ================================= */

        .no-result {
            display: none;
            text-align: center;
            color: #777780;
            padding: 30px;
        }


        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 768px) {

            .main-container {
                padding: 30px 18px 50px;
            }

            .page-header {
                align-items: start;
                flex-direction: column;
            }

            .page-title {
                font-size: 28px;
            }

            .add-btn {
                width: 100%;
            }

            .form-box {
                padding: 20px;
            }

        }

    </style>

</head>


<body>

    <main class="main-container">

        <!-- BACK -->

        <a
            href="dashboard.html"
            class="back-btn"
        >
            ← Back to Dashboard
        </a>


        <!-- PAGE HEADER -->

        <div class="page-header">

            <div>

                <h1 class="page-title">
                    My Skills
                </h1>

                <p class="page-description">
                    Manage the skills you want to share with the SkillVerse community.
                </p>

            </div>


            <button
                type="button"
                class="add-btn"
                onclick="showSkillForm()"
            >
                + Add Skill
            </button>

        </div>


        <!-- ADD SKILL FORM -->

        <div
            class="form-box"
            id="skillFormBox"
        >

            <div class="form-title">
                Add a New Skill
            </div>


            <form id="skillForm">

                <div class="row g-3">

                    <!-- SKILL NAME -->

                    <div class="col-md-6">

                        <label
                            for="skillName"
                            class="form-label"
                        >
                            Skill Name
                        </label>

                        <input
                            type="text"
                            id="skillName"
                            class="form-control"
                            placeholder="Example: Web Development"
                            required
                        >

                    </div>


                    <!-- CATEGORY -->

                    <div class="col-md-6">

                        <label
                            for="skillCategory"
                            class="form-label"
                        >
                            Category
                        </label>

                        <select
                            id="skillCategory"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="Technology">
                                Technology
                            </option>

                            <option value="Design">
                                Design
                            </option>

                            <option value="Programming">
                                Programming
                            </option>

                            <option value="Business">
                                Business
                            </option>

                            <option value="Communication">
                                Communication
                            </option>

                            <option value="Languages">
                                Languages
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- LEVEL -->

                    <div class="col-md-6">

                        <label
                            for="skillLevel"
                            class="form-label"
                        >
                            Skill Level
                        </label>

                        <select
                            id="skillLevel"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select level
                            </option>

                            <option value="Beginner">
                                Beginner
                            </option>

                            <option value="Intermediate">
                                Intermediate
                            </option>

                            <option value="Advanced">
                                Advanced
                            </option>

                            <option value="Expert">
                                Expert
                            </option>

                        </select>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="col-md-6">

                        <label
                            for="skillDescription"
                            class="form-label"
                        >
                            Short Description
                        </label>

                        <textarea
                            id="skillDescription"
                            class="form-control"
                            rows="3"
                            placeholder="Tell learners what you can teach..."
                            required
                        ></textarea>

                    </div>

                </div>


                <!-- FORM BUTTONS -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Skill
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="hideSkillForm()"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search your skills..."
                oninput="searchSkills()"
            >

        </div>


        <!-- EMPTY STATE -->

        <div
            class="empty-box"
            id="emptyBox"
        >

            <div class="empty-icon">
                💡
            </div>

            <h3>
                No skills added yet
            </h3>

            <p>
                Start by adding a skill that you are confident in
                and want to teach others.
            </p>

        </div>


        <!-- SKILLS -->

        <div
            class="row g-4"
            id="skillsContainer"
        ></div>


        <!-- NO SEARCH RESULT -->

        <div
            class="no-result"
            id="noResult"
        >
            No matching skills found.
        </div>


    </main>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script type="module">

        import { requireAuth } from "./js/skillverse-core.js";
        import { apiGet, apiPost, apiPut, apiDelete } from "./js/api.js";

        // Redirect to login if not signed in
        if (!requireAuth()) {
            throw new Error("redirecting to login");
        }

        const skillGrid = document.getElementById("skillsContainer");
        const emptyBox = document.getElementById("emptyBox");
        const noResult = document.getElementById("noResult");
        let mySkills = [];
        let editingId = null;

        async function loadSkills() {
            try {
                const data = await apiGet("/skills/mine");
                mySkills = data.skills || [];
                displaySkills(mySkills);
            } catch (err) {
                skillGrid.innerHTML = `<p style="color:#ff7d89;">${escapeHTML(err.message)}</p>`;
            }
        }

        function showSkillForm() {
            editingId = null;
            document.getElementById("skillForm").reset();
            document.getElementById("skillFormBox").style.display = "block";
        }

        function hideSkillForm() {
            editingId = null;
            document.getElementById("skillForm").reset();
            document.getElementById("skillFormBox").style.display = "none";
        }

        function getSkillIcon(category) {
            const icons = {
                Technology: "💻",
                Design: "🎨",
                Programming: "🧑‍💻",
                Business: "📊",
                Communication: "🗣️",
                Languages: "🌐",
                Other: "✨",
            };
            return icons[category] || "✨";
        }

        function displaySkills(skills) {
            skillGrid.innerHTML = "";

            if (!skills || skills.length === 0) {
                emptyBox.classList.remove("hidden");
                noResult.style.display = "none";
                return;
            }

            emptyBox.classList.add("hidden");
            noResult.style.display = "none";

            skills.forEach((skill) => {
                const col = document.createElement("div");
                col.className = "col-md-6 col-lg-4";
                col.innerHTML = `
                    <div class="skill-card">
                        <div class="skill-icon">${getSkillIcon(skill.category)}</div>
                        <h3>${escapeHTML(skill.name)}</h3>
                        <div class="skill-category">${escapeHTML(skill.category)}</div>
                        <span class="level-badge">${escapeHTML(skill.level)}</span>
                        <p>${escapeHTML(skill.description || "")}</p>
                        <div class="card-actions">
                            <button type="button" class="edit-btn" onclick="editSkill('${skill._id}')">Edit</button>
                            <button type="button" class="delete-btn" onclick="deleteSkill('${skill._id}')">Delete</button>
                        </div>
                    </div>
                `;
                skillGrid.appendChild(col);
            });
        }

        function editSkill(id) {
            const skill = mySkills.find((s) => s._id === id);
            if (!skill) return;
            editingId = id;
            document.getElementById("skillName").value = skill.name;
            document.getElementById("skillCategory").value = skill.category;
            document.getElementById("skillLevel").value = skill.level;
            document.getElementById("skillDescription").value = skill.description || "";
            document.getElementById("skillFormBox").style.display = "block";
            document.getElementById("skillFormBox").scrollIntoView({ behavior: "smooth" });
        }

        async function deleteSkill(id) {
            if (!confirm("Delete this skill? This cannot be undone.")) return;
            try {
                await apiDelete(`/skills/${id}`);
                await loadSkills();
            } catch (err) {
                alert(err.message);
            }
        }

        document.getElementById("skillForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const payload = {
                name: document.getElementById("skillName").value.trim(),
                category: document.getElementById("skillCategory").value,
                level: document.getElementById("skillLevel").value,
                description: document.getElementById("skillDescription").value.trim(),
            };

            const submitBtn = event.target.querySelector(".save-btn");
            if (submitBtn) submitBtn.disabled = true;

            try {
                if (editingId) {
                    await apiPut(`/skills/${editingId}`, payload);
                } else {
                    await apiPost("/skills", payload);
                }
                hideSkillForm();
                await loadSkills();
            } catch (err) {
                alert(err.message);
            } finally {
                if (submitBtn) submitBtn.disabled = false;
            }
        });

        function searchSkills() {
            const q = document.getElementById("searchInput").value.trim().toLowerCase();
            const filtered = q
                ? mySkills.filter((s) => s.name.toLowerCase().includes(q) || s.category.toLowerCase().includes(q))
                : mySkills;

            if (filtered.length === 0 && mySkills.length > 0) {
                skillGrid.innerHTML = "";
                emptyBox.classList.add("hidden");
                noResult.style.display = "block";
            } else {
                displaySkills(filtered);
            }
        }

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, (c) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
            }[c]));
        }

        // Inline onclick="" handlers need these on window (module scope doesn't leak globally)
        window.showSkillForm = showSkillForm;
        window.hideSkillForm = hideSkillForm;
        window.editSkill = editSkill;
        window.deleteSkill = deleteSkill;
        window.searchSkills = searchSkills;

        document.getElementById("searchInput").addEventListener("input", searchSkills);

        loadSkills();

    </script>


</body>

</html>
